name: Benchmarks

on:
  workflow_dispatch:

jobs:
  search-benchmarks:
    name: Search benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sequential search benchmarks
        run: |
          set -o pipefail
          go test ./engine -run '^$' -bench '^Benchmark(SequentialSearchMoves|SearchAccuracyFixedFEN|SearchCountersFixedFEN)$' -benchtime=1x -count=1 -benchmem -timeout=0 | tee benchmark-results.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
